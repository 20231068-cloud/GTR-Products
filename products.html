<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全系列产品 | GTR GPU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb orb-cyan"></div>
  <div class="bg-orb orb-purple"></div>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo"><i class="fas fa-microchip"></i><span>GTR<span class="logo-dot">.</span>GPU</span></a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="products.html" class="active">产品</a>
        <a href="contact.html">联系</a>
        <div class="cart-icon" id="cartBtn">
          <i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span>
        </div>
      </nav>
    </div>
  </header>

  <div class="container" style="padding-top: 60px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 12px;">全系列装备</h1>
    <p style="color: var(--text-muted); margin-bottom: 40px;">从经典入门到未来旗舰，从图形计算到显示视界，为你打造极致体验。</p>
    
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="gpu">显卡 GPU</button>
      <button class="filter-btn" data-filter="cpu">处理器 CPU</button>
      <button class="filter-btn" data-filter="monitor">显示器 屏幕</button>
      <button class="filter-btn" data-filter="gaming">电竞</button>
      <button class="filter-btn" data-filter="creator">创作</button>
      <button class="filter-btn" data-filter="flagship">旗舰</button>
    </div>
  </div>

  <section class="container" style="padding-bottom: 80px;">
    <div class="product-grid" id="productGrid"></div>
  </section>

  <footer>
    <div class="container">
      <p><i class="fas fa-microchip"></i> GTR GPU — 极客装备 · 未来算力</p>
    </div>
  </footer>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header"><h3><i class="fas fa-shopping-cart"></i> 购物车</h3><button class="cart-close" id="cartClose"><i class="fas fa-times"></i></button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">合计: <span id="cartTotal">¥0</span></div>
      <button class="btn-primary" id="checkoutBtn" style="width:100%; justify-content:center;">去结算</button>
    </div>
  </aside>
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">操作成功</span></div>

  <script src="script.js"></script>
</body>
</html>
