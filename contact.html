<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系我们 | GTR GPU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb orb-purple"></div>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo"><i class="fas fa-microchip"></i><span>GTR<span class="logo-dot">.</span>GPU</span></a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="products.html">产品</a>
        <a href="contact.html" class="active">联系</a>
        <div class="cart-icon" id="cartBtn">
          <i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span>
        </div>
      </nav>
    </div>
  </header>

  <div class="container" style="padding-top: 60px; padding-bottom: 80px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 12px;">联系我们</h1>
    <p style="color: var(--text-muted); margin-bottom: 40px;">遇到技术难题？需要批量采购？GTR 专家团队随时为你待命。</p>

    <div class="checkout-grid">
      <div class="checkout-panel">
        <h2>发送消息</h2>
        <form id="contactForm">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
            <div class="form-group"><label>姓名</label><input type="text" required></div>
            <div class="form-group"><label>邮箱</label><input type="email" required></div>
          </div>
          <div class="form-group"><label>留言内容</label><input type="text" required></div>
          <button type="submit" class="btn-primary" style="width:100%; justify-content:center;"><i class="fas fa-paper-plane"></i> 发送消息</button>
        </form>
      </div>
      <div class="checkout-panel">
        <h2>联系方式</h2>
        <p style="margin-bottom: 16px; color: var(--text-muted);"><i class="fas fa-envelope" style="color:var(--cyan); width:24px;"></i> support@gtrgpu.com</p>
        <p style="margin-bottom: 16px; color: var(--text-muted);"><i class="fas fa-phone" style="color:var(--cyan); width:24px;"></i> +86 400-888-6060</p>
        <p style="color: var(--text-muted);"><i class="fas fa-map-marker-alt" style="color:var(--cyan); width:24px;"></i> 深圳市南山区科技园 GTR 大厦</p>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">操作成功</span></div>
  <script src="script.js"></script>
</body>
</html>
