<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全结算 | GTR GPU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb orb-cyan"></div>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo"><i class="fas fa-microchip"></i><span>GTR<span class="logo-dot">.</span>GPU</span></a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="products.html">产品</a>
        <a href="contact.html">联系</a>
      </nav>
    </div>
  </header>

  <div class="container" style="padding-top: 60px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 40px;"><i class="fas fa-shield-alt" style="color:var(--cyan);"></i> 安全结算</h1>
    
    <div class="checkout-grid">
      <!-- 左侧：表单 -->
      <div>
        <div class="checkout-panel" style="margin-bottom: 30px;">
          <h2>1. 收货信息</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group"><label>收货人姓名</label><input type="text" placeholder="您的姓名" required></div>
            <div class="form-group"><label>联系电话</label><input type="tel" placeholder="11位手机号" required></div>
          </div>
          <div class="form-group"><label>所在地区</label><input type="text" placeholder="省 / 市 / 区" required></div>
          <div class="form-group"><label>详细地址</label><input type="text" placeholder="街道、门牌号等" required></div>
        </div>

        <div class="checkout-panel">
          <h2>2. 支付方式</h2>
          <div class="payment-methods">
            <label class="payment-method active">
              <input type="radio" name="pay" checked> <i class="fab fa-alipay" style="color:#1677FF; font-size:1.5rem;"></i> 支付宝 (模拟)
            </label>
            <label class="payment-method">
              <input type="radio" name="pay"> <i class="fab fa-weixin" style="color:#07C160; font-size:1.5rem;"></i> 微信支付 (模拟)
            </label>
            <label class="payment-method">
              <input type="radio" name="pay"> <i class="fas fa-credit-card" style="color:var(--cyan); font-size:1.5rem;"></i> 信用卡 (模拟)
            </label>
          </div>
        </div>
      </div>

      <!-- 右侧：订单汇总 -->
      <div>
        <div class="checkout-panel" style="position: sticky; top: 100px;">
          <h2>订单明细</h2>
          <div id="checkoutItemsList" style="margin-bottom: 20px;"></div>
          <div class="order-total">
            应付总额: <span id="checkoutTotal">¥0</span>
          </div>
          <button class="btn-primary" id="payNowBtn" style="width:100%; justify-content:center; margin-top: 24px; padding: 16px; font-size: 1.1rem;">
            <i class="fas fa-lock"></i> 确认支付
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">操作成功</span></div>
  <script src="script.js"></script>
</body>
</html>
