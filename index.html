<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTR GPU | 极客装备 · 未来算力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb orb-cyan"></div>
  <div class="bg-orb orb-purple"></div>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo"><i class="fas fa-microchip"></i><span>GTR<span class="logo-dot">.</span>GPU</span></a>
      <nav class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="products.html">产品</a>
        <a href="contact.html">联系</a>
        <div class="cart-icon" id="cartBtn">
          <i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero-carousel">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-slide active">
        <div class="container slide-content">
          <div class="slide-badge"><i class="fas fa-bolt"></i> 告别卡顿 · 拒绝掉帧</div>
          <h1>还在忍受<br>PPT般的游戏画面？</h1>
          <p>GTR 全新架构，光追性能提升 300%。让你每一次击杀都快人一步。</p>
          <a href="products.html" class="btn-primary"><i class="fas fa-arrow-right"></i> 立即升级装备</a>
        </div>
        <div class="slide-visual">
          <div class="gpu-3d" style="transform: scale(1.5) rotateX(25deg) rotateY(-15deg);">
            <div class="gpu-fan"></div><div class="gpu-fan"></div><div class="gpu-bar"></div>
          </div>
        </div>
      </div>
      <div class="carousel-slide">
        <div class="container slide-content">
          <div class="slide-badge"><i class="fas fa-desktop"></i> 视界跃升 · 极致色彩</div>
          <h1>OLED 屏幕<br>看见真正的“黑”</h1>
          <p>GTR OLED 34W 带鱼屏，0.03ms极速响应，沉浸式游戏体验。</p>
          <a href="products.html" class="btn-primary"><i class="fas fa-arrow-right"></i> 探索显示器</a>
        </div>
        <div class="slide-visual">
           <div class="monitor-3d" style="transform: scale(1.4) rotateX(15deg) rotateY(-10deg);">
             <div class="monitor-screen"></div>
             <div class="monitor-neck"></div>
             <div class="monitor-base"></div>
           </div>
        </div>
      </div>
    </div>
    <button class="carousel-btn prev" id="carouselPrev"><i class="fas fa-chevron-left"></i></button>
    <button class="carousel-btn next" id="carouselNext"><i class="fas fa-chevron-right"></i></button>
    <div class="carousel-dots" id="carouselDots"></div>
  </section>

  <section class="container">
    <div class="section-header">
      <h2><i class="fas fa-bolt"></i> 明星装备推荐</h2>
      <a href="products.html" class="link-arrow">查看全部 <i class="fas fa-arrow-right"></i></a>
    </div>
    <div class="featured-grid" id="featuredGrid"></div>
  </section>

  <footer>
    <div class="container">
      <p><i class="fas fa-microchip"></i> GTR GPU — 极客装备 · 未来算力</p>
      <p style="margin-top:8px; opacity:0.6; font-size:0.8rem;">© 2025 GTR Technologies. 本页面为概念展示。</p>
    </div>
  </footer>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header"><h3><i class="fas fa-shopping-cart"></i> 购物车</h3><button class="cart-close" id="cartClose"><i class="fas fa-times"></i></button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">合计: <span id="cartTotal">¥0</span></div>
      <button class="btn-primary" id="checkoutBtn" style="width:100%; justify-content:center;">去结算</button>
    </div>
  </aside>
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">操作成功</span></div>

  <script src="script.js"></script>
</body>
</html>
